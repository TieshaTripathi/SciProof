services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sciproof
      POSTGRES_USER: sciproof
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sciproof"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    volumes: ["queue:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://sciproof:${POSTGRES_PASSWORD}@db:5432/sciproof
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      STORAGE_ROOT: /data/artifacts
      STORAGE_ENCRYPTION_KEY: ${STORAGE_ENCRYPTION_KEY:?Set STORAGE_ENCRYPTION_KEY}
      APP_ENV: ${APP_ENV:-development}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["research:/data"]
    environment: *backend-env
    mem_limit: 1g
    cpus: 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  worker:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    command: ["python", "-m", "celery", "-A", "apps.api.tasks:celery", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment: *backend-env
    volumes: ["research:/data"]
    mem_limit: 1g
    cpus: 2
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  scheduler:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    command: ["python", "-m", "celery", "-A", "apps.api.tasks:celery", "beat", "--loglevel=INFO", "--schedule=/data/celerybeat"]
    environment: *backend-env
    volumes: ["scheduler:/data"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api:
        condition: service_healthy
volumes:
  research:
  database:
  queue:
  scheduler:
